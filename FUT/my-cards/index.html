<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le mie carte · Fantaballa FUT</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#07111d;color:#eef7ff;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:rgba(7,17,29,.94);backdrop-filter:blur(14px);border-bottom:1px solid #20364d;padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h1{font-size:20px;margin:0 auto 0 0}.btn,select,input{border:1px solid #2a4865;background:#0d1c2d;color:#fff;border-radius:10px;padding:10px 12px}.btn{cursor:pointer;text-decoration:none}.btn.primary{background:#1f9dff;border-color:#1f9dff}.wrap{max-width:1300px;margin:auto;padding:22px}.status{padding:14px 0;color:#9fb4c8}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.controls input{min-width:240px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#0d1c2d;border:1px solid #1d3850;border-radius:14px;padding:10px;position:relative;min-height:255px}.card img{width:100%;aspect-ratio:3/4;object-fit:contain;display:block}.name{font-weight:800;margin-top:8px}.meta{font-size:12px;color:#9fb4c8;line-height:1.45}.count{position:absolute;top:9px;right:9px;background:#1f9dff;color:white;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.empty{padding:40px 10px;text-align:center;color:#9fb4c8}.user{font-size:12px;color:#9fb4c8}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px}.card{min-height:0}}
</style>
</head>
<body>
<header class="top"><h1>🗂️ Le mie carte</h1><span class="user" id="userLabel">Non autenticato</span><button class="btn primary" id="loginBtn">Accedi con Google</button><button class="btn hidden" id="logoutBtn">Esci</button><a class="btn" href="../store.html?mode=fantaballa">Store</a><a class="btn" href="../cards/">Vetrina</a></header>
<main class="wrap"><div class="controls"><input id="search" placeholder="Cerca nome, serie, rarità…"><select id="game"><option value="">Tutte le squadre</option><option>Fantaballa FC</option><option>Gotham City</option></select><select id="sort"><option value="name">Nome</option><option value="rarity">Rarità</option><option value="count">Quantità</option></select></div><div class="status" id="status">Accedi per vedere il tuo inventario.</div><div class="grid" id="grid"></div></main>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDv23gasgBuAtPeDJeztyJ5P2S7NWq1svo",authDomain:"fantaball-9e19c.firebaseapp.com",projectId:"fantaball-9e19c",storageBucket:"fantaball-9e19c.appspot.com",messagingSenderId:"683304379837",appId:"1:683304379837:web:d2bbe7a814e2e40e075ed4",measurementId:"G-C8Q8K5B52C"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();let items=[];
const cardMetaById = {};
let cardMetaPromise = null;

function loadCardMeta(){
  if(cardMetaPromise) return cardMetaPromise;
  cardMetaPromise = fetch('../data/cards.json', {cache:'no-store'})
    .then(r => {
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(data => {
      if(Array.isArray(data)){
        data.forEach(c => {
          if(c && c.id) cardMetaById[String(c.id)] = c;
        });
      }
    })
    .catch(e => console.warn('[MY CARDS metadata]', e));
  return cardMetaPromise;
}

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
  .catch(e=>console.warn('[MY CARDS persistence]',e));
const $=id=>document.getElementById(id),grid=$('grid'),status=$('status'),loginBtn=$('loginBtn'),logoutBtn=$('logoutBtn');
function imgCandidates(v){
  v=String(v||'').trim().replace(/^\.\//,'').replace(/^FUT\//,'');
  const a=[];
  const add=x=>x&&!a.includes(x)&&a.push(x);
  if(v){
    add('../'+v);
    if(/\.png$/i.test(v))add('../'+v.replace(/\.png$/i,'.webp'));
    if(/\.webp$/i.test(v))add('../'+v.replace(/\.webp$/i,'.png'));
  }
  // Fallback grafico universale per carte senza immagine o con file mancante.
  add('../img/nEW%20pLAYER.webp');
  // Compatibilità con eventuali vecchie installazioni.
  add('../img/nEW%20pLAYER.png');
  return a;
}
function smartImg(el,path){
  const a=imgCandidates(path);
  let i=0;
  el.onerror=()=>{
    i++;
    if(i<a.length){el.src=a[i];return;}
    el.onerror=null;
  };
  el.src=a[0];
}
function render(){
  const q=$('search').value.trim().toLowerCase(),g=$('game').value,s=$('sort').value;
  const sameGame=(cardGame,filterGame)=>{
    if(!filterGame)return true;
    const a=String(cardGame||'').trim().toLowerCase();
    const b=String(filterGame||'').trim().toLowerCase();
    if(b==='gotham city')return ['gotham city','gotham city fc','gotahm city'].includes(a);
    if(b==='fantaballa fc')return a==='fantaballa fc';
    return a===b;
  };
  let list=items.filter(c=>sameGame(c.game,g)&&(!q||[c.name,c.series,c.rarity,c.game].join(' ').toLowerCase().includes(q)));list.sort((a,b)=>s==='count'?(b.count||0)-(a.count||0):String(a[s]||'').localeCompare(String(b[s]||''),'it'));grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">Nessuna carta da mostrare.</div>';return}for(const c of list){const d=document.createElement('article');d.className='card';const im=document.createElement('img');im.alt=c.name||'Carta';smartImg(im,c.img);d.append(im);d.insertAdjacentHTML('beforeend',`<span class="count">×${c.count||1}</span><div class="name"></div><div class="meta"></div>`);d.querySelector('.name').textContent=c.name||'Carta';d.querySelector('.meta').textContent=[c.rarity,c.series,c.game].filter(Boolean).join(' • ');grid.append(d)}}
async function loadInventory(u){
  console.log('[MY CARDS INVENTORY] Lettura UID:',u.uid);
  status.textContent='Caricamento inventario…';
  try{
    await loadCardMeta();
    const snap=await db.collection('users').doc(u.uid).collection('inventory').get();

    items=snap.docs.map(d=>{
      const saved=d.data()||{};
      const meta=cardMetaById[d.id]||{};
      return {
        id:d.id,
        ...saved,
        // game/series/img possono essere ricavati dal database pubblico senza
        // doverli scrivere in Firestore, mantenendo compatibili le regole attuali.
        game:saved.game||meta.game||'',
        series:saved.series||meta.series||'',
        img:saved.img||meta.img||'',
        name:saved.name||meta.name||d.id,
        rarity:saved.rarity||meta.rarity||''
      };
    });

    status.textContent=`${items.length} carte diverse · ${items.reduce((n,c)=>n+(Number(c.count)||1),0)} copie totali`;
    render();
  }catch(e){
    console.error(e);
    status.textContent='Errore nel caricamento dell’inventario.';
  }
}
loginBtn.onclick=async()=>{
  const p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:'select_account'});
  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(auth.currentUser&&auth.currentUser.isAnonymous)await auth.signOut();
    if(!auth.currentUser){
      const r=await auth.signInWithPopup(p);
      console.log('[MY CARDS AUTH] Google UID:',r.user?.uid);
    }
  }catch(e){
    console.error('[Google popup login]',e);
    if(e&&e.code==='auth/popup-blocked')alert('Consenti i popup per fantaballa.it e riprova.');
  }
};logoutBtn.onclick=()=>auth.signOut();['search','game','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
auth.onAuthStateChanged(u=>{if(u&&!u.isAnonymous){$('userLabel').textContent=u.displayName||u.email||'Utente';loginBtn.classList.add('hidden');logoutBtn.classList.remove('hidden');loadInventory(u)}else{$('userLabel').textContent='Non autenticato';loginBtn.classList.remove('hidden');logoutBtn.classList.add('hidden');items=[];grid.innerHTML='';status.textContent='Accedi per vedere il tuo inventario.'}});
</script></body></html>
