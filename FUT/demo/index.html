<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTTU — Demo Pack</title>
<style>
:root{--bg:#05080d;--panel:#0c121a;--line:#263340;--text:#f4f7fa;--muted:#8d9aa8;--a:#52e3d8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#132333 0,#05080d 42%,#020407 100%);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{height:64px;border-bottom:1px solid #1c2732;display:flex;align-items:center;padding:0 22px;background:#070b11}
.logo{width:38px;height:38px;display:grid;place-items:center;background:#17212d;clip-path:polygon(50% 0,94% 20%,83% 80%,50% 100%,17% 80%,6% 20%);font-weight:900;font-style:italic}
.brand{margin-left:12px}.brand b{display:block;font-size:13px;letter-spacing:.08em}.brand span{font-size:11px;color:var(--muted)}
.pill{margin-left:auto;color:var(--a);border:1px solid #245b59;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900}
main{max-width:1380px;margin:auto;padding:30px 20px 48px;text-align:center}
.eyebrow{color:var(--a);font-size:12px;font-weight:900;letter-spacing:.14em}h1{font-size:clamp(34px,5vw,60px);margin:8px 0 8px}
.lead{color:var(--muted);max-width:700px;margin:0 auto 24px;line-height:1.5}
.stage{min-height:500px;border:1px solid #1c2935;border-radius:24px;background:radial-gradient(circle at center,rgba(82,227,216,.1),transparent 30%),linear-gradient(180deg,#0d151f,#05080d);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:20px}
.packwrap{padding:28px}.pack{width:240px;height:330px;margin:auto;cursor:pointer;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));transition:.25s}
.pack:hover{transform:translateY(-8px) scale(1.025)}.pack img{width:100%;height:100%;object-fit:contain}
.fallback{width:100%;height:100%;border-radius:24px;border:2px solid #dbbd50;background:linear-gradient(145deg,#153daf,#07143a 60%,#c79616);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset 0 0 0 5px rgba(255,255,255,.06)}
.fallback b{font-size:36px;line-height:.95}.fallback span{margin-top:10px;color:#ffe69c;font-weight:900;letter-spacing:.16em}
.name{font-size:22px;font-weight:900;margin-top:8px}.desc{font-size:13px;color:var(--muted);margin:5px 0 14px}
button{min-height:48px;border:1px solid #68eee5;border-radius:10px;background:linear-gradient(#67ede4,#2ebdb4);color:#031513;padding:0 22px;font-weight:950;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.opening .pack{animation:openPack .9s ease both}@keyframes openPack{0%{transform:scale(1)}25%{transform:rotate(-4deg) scale(1.05)}45%{transform:rotate(4deg) scale(1.08)}65%{transform:rotate(-2deg) scale(1.1)}100%{transform:scale(.2);opacity:0;filter:brightness(4)}}
.results{display:none;width:100%;max-width:1180px;margin:0 auto;padding:8px 0;text-align:center}.results.show{display:block}.results h2{font-size:26px;margin:0 0 15px}
.cards{display:grid;grid-template-columns:repeat(6,minmax(110px,160px));justify-content:center;align-items:start;gap:14px}
.card{min-width:0;animation:reveal .5s ease both}.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}.card:nth-child(5){animation-delay:.32s}.card:nth-child(6){animation-delay:.4s}
@keyframes reveal{from{opacity:0;transform:translateY(24px) scale(.9);filter:brightness(2)}to{opacity:1;transform:none;filter:none}}
.art{aspect-ratio:.71;background:#091019;border:1px solid #1f2e3b;border-radius:14px;overflow:hidden;display:grid;place-items:center;box-shadow:0 14px 28px rgba(0,0,0,.4)}
.art img{width:100%;height:100%;object-fit:contain}.cn{font-size:13px;font-weight:900;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cm{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.again{margin-top:24px}.err{display:none;margin:14px 0;padding:11px;border:1px solid #69313b;background:#241116;color:#ff9dab;border-radius:10px}.err.show{display:block}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(120px,170px))}.stage{min-height:650px}}@media(max-width:650px){header{padding:0 12px}.pill{display:none}main{padding:24px 12px 40px}.pack{width:210px;height:290px}.stage{min-height:720px;padding:14px}.cards{grid-template-columns:repeat(2,minmax(115px,150px));gap:10px}.results h2{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
<header><div class="logo">UT</div><div class="brand"><b>FUTTU ULTIMATE TEAM</b><span>Demo Pack Opening</span></div><div class="pill">NESSUN LOGIN · GRATIS</div></header>
<main>
<div class="eyebrow">PROVA LO SPACCHETTAMENTO</div><h1>Demo Pack</h1>
<p class="lead">Apri il pacchetto e scopri 6 carte casuali. Nessun account, nessun Firebase, nessun salvataggio.</p>
<section class="stage" id="stage">
<div class="packwrap" id="packwrap">
<div class="pack" id="pack" tabindex="0" role="button" aria-label="Apri Demo Pack"><img id="packimg" src="../img/back%20world.webp" alt="Demo Pack"></div>
<div class="name">Demo Pack</div><div class="desc">6 carte casuali · aperture illimitate</div>
<button id="open" type="button">🎁 APRI PACCHETTO</button>
</div>
<section id="results" class="results"><h2>Il tuo pacchetto</h2><div id="cards" class="cards"></div><div class="again"><button id="again" type="button">APRI UN ALTRO DEMO PACK</button></div></section>
</section>
<div id="err" class="err"></div>
</main></div>
<script>
(function(){
const app=document.getElementById('app'),pack=document.getElementById('pack'),packimg=document.getElementById('packimg'),wrap=document.getElementById('packwrap'),open=document.getElementById('open'),again=document.getElementById('again'),results=document.getElementById('results'),cardsEl=document.getElementById('cards'),err=document.getElementById('err');
let cards=[],busy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function img(c){if(!c||!c.img)return '../img/nEW%20pLAYER.webp';const p=String(c.img);if(/^https?:/i.test(p))return p;if(p.startsWith('FUT/'))return '../../'+p;if(p.startsWith('img/'))return '../'+p;return '../'+p.replace(/^\.?\//,'')}
packimg.addEventListener('error',()=>{packimg.style.display='none';const d=document.createElement('div');d.className='fallback';d.innerHTML='<b>DEMO<br>PACK</b><span>6 CARTE</span>';pack.appendChild(d)},{once:true});
async function load(){try{const r=await fetch('../data/cards.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d)||!d.length)throw new Error('vuoto');cards=d.filter(c=>c&&(c.name||c.id));open.disabled=false}catch(e){err.textContent='Non riesco a caricare FUT/data/cards.json. Pubblica questa pagina dentro FUT/demo/.';err.classList.add('show');open.disabled=true;console.error(e)}}
function pick(){const a=cards.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,6)}
function render(a){cardsEl.innerHTML=a.map(c=>'<article class="card"><div class="art"><img data-ci src="'+esc(img(c))+'" alt="'+esc(c.name||'Carta FUT')+'"></div><div class="cn">'+esc(c.name||c.id||'Carta FUT')+'</div><div class="cm">'+esc([c.role,c.rarity,c.series].filter(Boolean).join(' · '))+'</div></article>').join('');cardsEl.querySelectorAll('[data-ci]').forEach(i=>i.addEventListener('error',()=>{i.src='../img/nEW%20pLAYER.webp'},{once:true}))}
function doOpen(){if(busy||!cards.length)return;busy=true;open.disabled=true;results.classList.remove('show');app.classList.remove('opening');void app.offsetWidth;app.classList.add('opening');const p=pick();setTimeout(()=>{render(p);wrap.style.visibility='hidden';results.classList.add('show');document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'});busy=false},900)}
function reset(){app.classList.remove('opening');wrap.style.visibility='visible';results.classList.remove('show');cardsEl.innerHTML='';open.disabled=false;document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'})}
open.addEventListener('click',doOpen);pack.addEventListener('click',doOpen);pack.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doOpen()}});again.addEventListener('click',reset);open.disabled=true;load();
})();
</script>
</body></html>
