      <stop stop-color="#0E2118"/>
      <stop offset="1" stop-color="#132D22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1130 200) rotate(90) scale(320 340)">
      <stop stop-color="#6EE7D5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6EE7D5" stop-opacity="0"/>
