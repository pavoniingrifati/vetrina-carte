<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Stadio notturno di Halloween con zucca luminosa, pipistrelli e luna arancione">
 <defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#140d0b"/><stop offset=".58" stop-color="#21100c"/><stop offset="1" stop-color="#090909"/></linearGradient>
  <radialGradient id="moon"><stop stop-color="#ffe4ad"/><stop offset=".55" stop-color="#ffc56e"/><stop offset="1" stop-color="#eb7831"/></radialGradient>
  <radialGradient id="skyGlow"><stop stop-color="#f98b23" stop-opacity=".36"/><stop offset="1" stop-color="#f98b23" stop-opacity="0"/></radialGradient>
  <radialGradient id="pumpkin"><stop offset="0" stop-color="#ffb744"/><stop offset=".6" stop-color="#f9851b"/><stop offset="1" stop-color="#9f390b"/></radialGradient>
  <linearGradient id="ribs"><stop stop-color="#8e310b" stop-opacity=".8"/><stop offset=".48" stop-color="#ee6f11" stop-opacity=".3"/><stop offset="1" stop-color="#702109" stop-opacity=".8"/></linearGradient>
  <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff9b3d" stop-opacity=".16"/><stop offset="1" stop-color="#c24a12" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="30" stdDeviation="22" flood-color="#000" flood-opacity=".8"/></filter>
 </defs>
