<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurazione · Fantaballa FC</title><style>body{margin:0;background:#111;color:#eee;font:16px system-ui}main{max-width:740px;margin:60px auto;padding:24px}a{color:#d6ff00}h1{font-size:36px}p{color:#bbb;line-height:1.6}input{box-sizing:border-box;width:100%;padding:16px;border:1px solid #666;border-radius:9px;margin:15px 0;font:inherit}button{background:#d6ff00;color:#111;padding:14px 20px;border:0;border-radius:8px;font-weight:800;cursor:pointer}label{display:block;font-weight:700}</style><main><a href="admin_giornata_fantaballa.html">← Admin</a><h1>Invio rose · Fantaballa FC</h1><p>Crea il foglio separato seguendo le istruzioni in LEGGIMI.txt. Incolla qui l’indirizzo della nuova applicazione Google e scarica config.json. Sostituisci quello nella cartella fantaballafc e pubblica il file.</p><label for="url">Indirizzo applicazione Google</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec"><button id="save">Scarica config.json</button><p id="status" role="status"></p></main><script>document.getElementById('save').onclick=()=>{const url=document.getElementById('url').value.trim();if(!/^https:\/\/script.google.com\/macros\/s\/[^/]+\/exec$/.test(url)){document.getElementById('status').textContent='Inserisci un indirizzo Google Apps Script valido che termina con /exec.';return;}const data={project:'fantaballafc',competition:'Premier Division Super Lega',googleSheetWebAppUrl:url};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const src=URL.createObjectURL(blob),a=document.createElement('a');a.href=src;a.download='config.json';a.click();setTimeout(()=>URL.revokeObjectURL(src),1000);document.getElementById('status').textContent='File pronto: sostituisci config.json nella cartella fantaballafc.';};</script></html>
